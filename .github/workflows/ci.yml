name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review is NOT one of the default activity types (which are
    # opened/synchronize/reopened). Without it, a PR opened as a draft and later
    # marked ready never starts CI: it sits at mergeable_state "blocked" with
    # zero check runs, indefinitely. That failure mode is dangerous because it
    # presents as an *absent* check rather than a red one, so a PR can look
    # merge-ready having never been built or tested. See #226.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Split the Playwright suite into named jobs by scene rather than by an
      # opaque numeric shard. The tests run on software WebGL (SwiftShader) with
      # no GPU, and every test pays its own scene shader-compile, so cost tracks
      # which 3D scene a test loads. Grouping by scene keeps each job short and
      # self-documenting: a PR that touches nothing fishtank-related can ignore a
      # slow "fishtank" run, etc. The "core" job catches the cheap, untagged
      # non-scene tests (2D mode, language, panel toggle, default load). Each
      # runner still uses workers:1 (see playwright.config.ts) to avoid
      # SwiftShader contexts starving each other. To rebalance, move a spec's
      # @scene tag rather than renumbering shards.
      fail-fast: false
      matrix:
        include:
          - name: fishtank
            filter: --grep @fishtank
          - name: nature
            filter: --grep @nature
          - name: arcade
            filter: --grep @arcade
          - name: core
            filter: '--grep-invert "@fishtank|@nature|@arcade"'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # On a cache hit the browser binary is already present, but the apt
      # system libraries it links against are not, so still install those.
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e -- ${{ matrix.filter }}
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

