name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review is NOT one of the default activity types (which are
    # opened/synchronize/reopened). Without it, a PR opened as a draft and later
    # marked ready never starts CI: it sits at mergeable_state "blocked" with
    # zero check runs, indefinitely. That failure mode is dangerous because it
    # presents as an *absent* check rather than a red one, so a PR can look
    # merge-ready having never been built or tested. See #226.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      # Cheap guard against an e2e spec that no CI shard happens to select.
      # Lives here rather than in an e2e job so it runs once, and off the
      # critical path of the jobs it is checking.
      - run: node scripts/checkE2eShards.mjs
        name: every e2e test belongs to exactly one shard

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Split the Playwright suite into named jobs, each one short enough to
      # keep the critical path near the 90s target in #308.
      #
      # Sharding is by cost, measured, not by category. Under software WebGL
      # (SwiftShader, no GPU) every test pays its own page load, and that load
      # is ~3s of shader compilation locally and roughly three times that on a
      # CI runner — which is why cost tracks the *number* of page loads far
      # more than what any individual test asserts. Grouping purely by scene
      # left one job with 12 tests at 4 minutes next to another with 3 at 23
      # seconds, so the whole run waited on the unlucky group.
      #
      # Names still say what broke. Scene jobs stay scene-tagged; the rest are
      # split by the concern their spec file covers.
      #
      # scripts/checkE2eShards.mjs fails the build if these filters stop
      # covering every test exactly once, which is the failure mode that
      # matters here: a spec no filter selects is never run and never missed.
      fail-fast: false
      matrix:
        include:
          - name: app
            filter: 'e2e/app.spec.ts --grep-invert "@nature|@arcade|@fishtank"'
          - name: layout
            filter: e2e/canvasSizing.spec.ts
          - name: overlay
            filter: e2e/diagnosticsOverlay.spec.ts
          - name: nature
            filter: 'e2e/app.spec.ts --grep "@nature"'
          - name: nature-shaders
            filter: e2e/birdFeather.nature.test.ts e2e/wingUndulation.spec.ts
          - name: arcade-fishtank
            filter: 'e2e/app.spec.ts --grep "@arcade|@fishtank"'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # On a cache hit the browser binary is already present, but the apt
      # system libraries it links against are not, so still install those.
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e -- ${{ matrix.filter }}
        env:
          CI: true
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

