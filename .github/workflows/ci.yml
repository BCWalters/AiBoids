name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Split the Playwright suite into two named jobs by content rather than by
      # an opaque numeric shard. The tests run on software WebGL (SwiftShader)
      # with no GPU, and the fishtank 3D scene is by far the most expensive to
      # render (seconds per frame), so it gets its own "fishtank" job. Every
      # other spec runs together in the fast "standard" job. Naming the jobs this
      # way means a PR that doesn't touch anything fishtank-related can safely
      # ignore a slow "fishtank" run. Each runner still uses workers:1 (see
      # playwright.config.ts) to avoid SwiftShader contexts starving each other.
      fail-fast: false
      matrix:
        include:
          - name: fishtank
            filter: --grep @fishtank
          - name: standard
            filter: --grep-invert @fishtank
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # On a cache hit the browser binary is already present, but the apt
      # system libraries it links against are not, so still install those.
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e -- ${{ matrix.filter }}
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

